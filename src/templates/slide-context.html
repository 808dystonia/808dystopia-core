<!doctype html>
<!-- Slide 2 (other / general news): headline + context paragraph.
     First draft — no Drive reference yet, built to match the established
     visual system (cover.html / slide-tracklist.html). Iterate on feedback. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Capture It";
    src: url("assets/Capture_it.ttf") format("truetype");
  }

  html, body {
    margin: 0;
    width: 1080px;
    height: 1350px;
    background: #000;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    color: #fff;
  }

  .badge {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 3px solid #fff;
    border-bottom: 3px solid #fff;
    border-left: 14px solid #fff;
    border-right: 14px solid #fff;
    box-sizing: border-box;
  }
  .badge span {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-style: italic;
    color: #fff;
  }
  .news-badge {
    left: 37.1%;
    width: 25.56%;
    top: 3.82%;
    height: 3.76%;
  }
  .news-badge span { font-size: 40px; }

  .glow {
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
  }

  /* The artist photo, faded far back, so the slide isn't flat black. */
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
    filter: grayscale(0.5) blur(2px) brightness(0.45);
  }
  .bg-fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 45%, #000 88%);
  }

  /* Sized by the fit script below. */
  .headline {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 11%;
    height: 20%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Capture It", Impact, sans-serif;
    text-transform: uppercase;
    line-height: 1.05;
    overflow-wrap: anywhere;
  }
  .headline .accent { color: #e01717; }

  .context {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 35%;
    bottom: 19%;
    display: flex;
    align-items: center;
  }
  .context-inner {
    border-left: 10px solid #e01717;
    padding-left: 0.9em;
    max-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.32;
  }
  .lead { font-weight: 900; color: #fff; }
  .rest { display: block; margin-top: 0.7em; font-weight: 400; color: #cfcfcf; font-size: 0.82em; }
  .rest:empty { display: none; }

  .source {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 82.5%;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 3px;
    color: #8a8a8a;
    text-transform: uppercase;
  }

  .rule {
    position: absolute;
    left: 14.12%;
    right: 0.51%;
    top: 92.9%;
    height: 3px;
    background: #fff;
  }

  .logo {
    position: absolute;
    left: 1.78%;
    top: 88.61%;
    width: 10.17%;
  }

  .swipe-badge {
    left: 35.52%;
    width: 29.04%;
    top: 94.18%;
    height: 4.78%;
  }
  .swipe-badge span { font-size: 44px; }

  .chevrons {
    position: absolute;
    left: 77.57%;
    width: 18.47%;
    top: 94.72%;
    height: 3.79%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chevron {
    width: 32px;
    height: 32px;
    border-top: 8px solid #fff;
    border-right: 8px solid #fff;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="{{PHOTO_URL}}" onerror="this.remove()" />
    <div class="bg-fade"></div>
    <div class="badge news-badge glow"><span>NEWS</span></div>

    <div class="headline"><span>{{TITLE}}</span></div>
    <div class="context"><div class="context-inner"><span class="lead">{{LEAD}}</span><span class="rest">{{REST}}</span></div></div>
    <div class="source">{{SOURCE}}</div>

    <div class="rule glow"></div>
    <img class="logo" src="assets/logo.png" />
    <div class="badge swipe-badge glow"><span>SWIPE</span></div>
    <div class="chevrons">
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
    </div>
  </div>
  <script>
    // Largest sizes that fit: the headline within its band (max 76px),
    // then the body text within its box (max 66px).
    window.__layoutDone = false;
    (async () => {
      await document.fonts.ready;
      const fit = (el, box, max, min) => {
        let size = max;
        el.style.fontSize = size + "px";
        while (size > min && (box.scrollHeight > box.clientHeight || el.scrollWidth > el.clientWidth + 1)) {
          el.style.fontSize = --size + "px";
        }
      };
      const headline = document.querySelector(".headline");
      fit(headline, headline, 76, 40);
      const box = document.querySelector(".context");
      const inner = box.querySelector(".context-inner");
      let size = 66;
      inner.style.fontSize = size + "px";
      while (size > 26 && inner.scrollHeight > box.clientHeight) inner.style.fontSize = --size + "px";
      window.__layoutDone = true;
    })();
  </script>
</body>
</html>
