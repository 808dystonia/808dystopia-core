<!doctype html>
<html><head><meta charset="utf-8" />
<style>
{{FONT_FACE}}
html, body { margin: 0; width: 1080px; height: 1350px; background: #000; color: #fff; overflow: hidden; }
.badge, h1, .tag, .body, .source, .swipe { font-family: CaptureIt, Impact, sans-serif; }
.badge { position: absolute; top: 28px; left: 36px; border: 3px solid #fff; padding: 4px 12px; font-size: 28px; }
h1 { position: absolute; top: 90px; left: 36px; width: 1008px; margin: 0; font-size: 120px; line-height: 0.85; }
.tag { position: absolute; top: 280px; left: 36px; color: #E10600; font-size: 36px; }
.body { position: absolute; top: 360px; left: 36px; width: 1008px; font-size: 36px; line-height: 1.2; color: #ddd; }
.source { position: absolute; left: 36px; top: 1148px; color: #888; font-size: 18px; }
.swipe { position: absolute; right: 36px; top: 1260px; font-size: 22px; }
</style></head>
<body>
  <div class="badge">NEWS</div>
  <h1>{{TITLE}}</h1>
  <div class="tag">MORE INFO</div>
  <div class="body">{{CONTEXT}}</div>
  <div class="source">{{SOURCE}}</div>
  <div class="swipe">SWIPE ▸▸</div>
</body></html>
