<!doctype html>
<html><head><meta charset="utf-8" />
<style>
html, body { margin: 0; width: 1080px; height: 1350px; background: #000; color: #fff; overflow: hidden; }
.badge { position: absolute; top: 28px; left: 36px; border: 3px solid #fff; padding: 4px 12px; font: 28px Impact, sans-serif; }
h1 { position: absolute; top: 90px; left: 36px; width: 1008px; margin: 0; font: 120px/0.85 Impact, sans-serif; }
.tag { position: absolute; top: 280px; left: 36px; color: #E10600; font: 36px Impact, sans-serif; }
.body { position: absolute; top: 360px; left: 36px; width: 1008px; font: 36px/1.2 Impact, sans-serif; color: #ddd; }
.source { position: absolute; left: 36px; top: 1148px; color: #888; font: 18px Impact, sans-serif; }
.swipe { position: absolute; right: 36px; top: 1260px; font: 22px Impact, sans-serif; }
</style></head>
<body>
  <div class="badge">NEWS</div>
  <h1>{{TITLE}}</h1>
  <div class="tag">MORE INFO</div>
  <div class="body">{{CONTEXT}}</div>
  <div class="source">{{SOURCE}}</div>
  <div class="swipe">SWIPE ▸▸</div>
</body></html>
