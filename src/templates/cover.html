<!doctype html>
<!-- Slide 1: cover photo + distressed-style title. Layout measured from
     STOKELY's Drive reference (808 News Template.png / 808 example news
     post.png) — see git history for exact pixel measurements. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Capture It";
    src: url("assets/Capture_it.ttf") format("truetype");
  }

  html, body {
    margin: 0;
    width: 1080px;
    height: 1350px;
    background: #000;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
  }

  .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      transparent 42%,
      rgba(0, 0, 0, 0.45) 48%,
      #000 56%,
      #000 100%
    );
  }

  .badge {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 3px solid #fff;
    border-bottom: 3px solid #fff;
    border-left: 14px solid #fff;
    border-right: 14px solid #fff;
    box-sizing: border-box;
  }
  .badge span {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-style: italic;
    color: #fff;
  }

  .news-badge {
    left: 37.1%;
    width: 25.56%;
    top: 58.96%;
    height: 3.48%;
  }
  .news-badge span { font-size: 40px; }

  .headline {
    position: absolute;
    left: 3.7%;
    right: 3.8%;
    top: 62.4%;
    height: 27.6%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: "Capture It", Impact, sans-serif;
    color: #fff;
    text-transform: uppercase;
    line-height: 1.05;
  }
  .headline .line1 { font-size: 108px; }
  .headline .line2 { font-size: 92px; }
  .headline .accent { color: #e01717; }

  .glow {
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
  }

  .rule {
    position: absolute;
    left: 14.12%;
    right: 0.51%;
    top: 92.9%;
    height: 3px;
    background: #fff;
  }

  .logo {
    position: absolute;
    left: 1.78%;
    top: 88.61%;
    width: 10.17%;
  }

  .swipe-badge {
    left: 35.52%;
    width: 29.04%;
    top: 94.18%;
    height: 4.78%;
  }
  .swipe-badge span { font-size: 44px; }

  .chevrons {
    position: absolute;
    left: 77.57%;
    width: 18.47%;
    top: 94.72%;
    height: 3.79%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chevron {
    width: 32px;
    height: 32px;
    border-top: 8px solid #fff;
    border-right: 8px solid #fff;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="photo" src="{{PHOTO_URL}}" />
    <div class="gradient"></div>

    <div class="badge news-badge glow"><span>NEWS</span></div>

    <div class="headline">
      <div class="line1">{{LINE1}}</div>
      <div class="line2">{{LINE2_HTML}}</div>
    </div>

    <div class="rule glow"></div>
    <img class="logo" src="assets/logo.png" />
    <div class="badge swipe-badge glow"><span>SWIPE</span></div>
    <div class="chevrons">
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
    </div>
  </div>
</body>
</html>
