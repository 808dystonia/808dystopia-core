<!doctype html>
<html><head><meta charset="utf-8" />
<style>
@font-face { font-family: Capture; src: local("Capture it"), local("Impact"); }
html, body { margin: 0; width: 1080px; height: 1350px; background: #000; overflow: hidden; }
.photo { position: absolute; left: 18px; top: 12px; width: 1044px; height: 708px; object-fit: cover; object-position: center 28%; }
.badge { position: absolute; left: 50%; top: 680px; transform: translateX(-50%); border: 3px solid #fff; color: #fff; background: #000; font-family: Capture, Impact, sans-serif; font-size: 28px; letter-spacing: 2px; padding: 6px 14px; }
.text { position: absolute; left: 0; top: 720px; width: 1080px; height: 468px; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.artist { font-family: Capture, Impact, sans-serif; color: #fff; font-size: 128px; line-height: 0.9; text-align: center; width: 1044px; text-transform: uppercase; }
.hook { font-family: Capture, Impact, sans-serif; color: #fff; font-size: 110px; line-height: 0.9; text-align: center; width: 1032px; text-transform: uppercase; margin-top: 8px; }
.hook .red { color: #E10600; }
.footer { position: absolute; left: 0; top: 1188px; width: 1080px; height: 162px; }
</style></head>
<body>
  <img class="photo" src="{{PHOTO_URL}}" alt="" />
  <div class="badge">NEWS</div>
  <div class="text"><div class="artist">{{ARTIST}}</div><div class="hook">{{HOOK}}</div></div>
  <div class="footer"></div>
</body></html>
