<!doctype html>
<!-- Slide 2 (album_drop): title + tracklist. Layout measured from
     STOKELY's Drive reference (808_Tracklist_Template.jpg). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Capture It";
    src: url("assets/Capture_it.ttf") format("truetype");
  }

  html, body {
    margin: 0;
    width: 1080px;
    height: 1350px;
    background: #000;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    color: #fff;
  }

  .badge {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 3px solid #fff;
    border-bottom: 3px solid #fff;
    border-left: 14px solid #fff;
    border-right: 14px solid #fff;
    box-sizing: border-box;
  }
  .badge span {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-style: italic;
    color: #fff;
  }
  .news-badge {
    left: 37.1%;
    width: 25.56%;
    top: 3.82%;
    height: 3.76%;
  }
  .news-badge span { font-size: 40px; }

  .glow {
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
  }

  .title {
    position: absolute;
    left: 3%;
    right: 3%;
    top: 10.5%;
    height: 15.5%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Capture It", Impact, sans-serif;
    text-transform: uppercase;
    line-height: 1;
    overflow-wrap: anywhere;
  }
  .title .accent { color: #e01717; margin-left: 0.12em; }

  .subtitle {
    position: absolute;
    left: 0;
    right: 0;
    top: 25.8%;
    height: 4.6%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    letter-spacing: 6px;
    font-size: 34px;
    color: #bbb;
  }
  .subtitle .dot { color: #e01717; margin: 0 0.5em; }

  /* Font size is set by the fit script below, not here. */
  .tracklist {
    position: absolute;
    left: 5%;
    right: 5%;
    top: 31.5%;
    bottom: 13%;
    display: flex;
    align-items: center;
  }
  .tracklist-cols {
    display: flex;
    flex-direction: row;
    width: 100%;
    max-height: 100%;
    gap: 5%;
  }
  .tracklist-col {
    display: flex;
    flex-direction: column;
    gap: 0.42em;
    flex: 1;
    min-width: 0;
  }
  .track-row {
    display: flex;
    align-items: baseline;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    white-space: nowrap;
    min-width: 0;
    line-height: 1.1;
  }
  .track-row .num {
    width: 1.7em;
    flex-shrink: 0;
    color: #e01717;
    font-variant-numeric: tabular-nums;
  }
  .track-row .name {
    flex-shrink: 0;
    max-width: calc(100% - 1.7em);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* The feature credit is the part that gives way when space runs out. */
  .track-row .feat {
    margin-left: 0.45em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.62em;
    font-weight: 700;
    color: #9a9a9a;
  }

  .rule {
    position: absolute;
    left: 14.12%;
    right: 0.51%;
    top: 92.9%;
    height: 3px;
    background: #fff;
  }

  .logo {
    position: absolute;
    left: 1.78%;
    top: 88.61%;
    width: 10.17%;
  }

  .swipe-badge {
    left: 35.52%;
    width: 29.04%;
    top: 94.18%;
    height: 4.78%;
  }
  .swipe-badge span { font-size: 44px; }

  .chevrons {
    position: absolute;
    left: 77.57%;
    width: 18.47%;
    top: 94.72%;
    height: 3.79%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chevron {
    width: 32px;
    height: 32px;
    border-top: 8px solid #fff;
    border-right: 8px solid #fff;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="badge news-badge glow"><span>NEWS</span></div>

    <!-- The inner span matters: a flex container (.title) treats each
         direct text-node/element child as its own independent anonymous
         flex item, so bare "text <span>accent</span>" would wrap as two
         separate boxes side by side instead of one flowing line. Wrapping
         it all in one span makes it a single flex item that wraps
         normally as one block. -->
    <div class="title" style="font-size: {{TITLE_FONT_SIZE}}px;"><span>{{TITLE_HTML}}</span></div>
    <div class="subtitle">TRACKLIST<span class="dot">&bull;</span>{{TRACK_COUNT}}</div>

    <div class="tracklist">
      {{TRACKLIST_ROWS_HTML}}
    </div>

    <div class="rule glow"></div>
    <img class="logo" src="assets/logo.png" />
    <div class="badge swipe-badge glow"><span>SWIPE</span></div>
    <div class="chevrons">
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
    </div>
  </div>
  <script>
    // Largest font (up to MAX) at which every title shows in full and the
    // list fits its box. Features may still trim, titles never do unless
    // MIN is reached (an absurdly long title).
    window.__layoutDone = false;
    (async () => {
      const MAX = 58, MIN = 18;
      await document.fonts.ready;
      // The album title first: shrink until it fits its band (10/04 "HEAVEN
      // ON MARS" wrapped onto the TRACKLIST line).
      const title = document.querySelector(".title");
      let titleSize = parseInt(title.style.fontSize, 10) || 140;
      while (titleSize > 40 && title.scrollHeight > title.clientHeight + 1) title.style.fontSize = --titleSize + "px";
      const box = document.querySelector(".tracklist");
      const cols = box.querySelector(".tracklist-cols");
      // Exact text width (a Range), not scrollWidth: that rounds, and a title
      // overflowing by under a pixel still gets cut with "...".
      const textWidth = (el) => {
        const range = document.createRange();
        range.selectNodeContents(el);
        return range.getBoundingClientRect().width;
      };
      const fits = () =>
        cols.scrollHeight <= box.clientHeight &&
        [...box.querySelectorAll(".name")].every((el) => textWidth(el) <= el.getBoundingClientRect().width + 0.01);
      let size = MAX;
      box.style.fontSize = size + "px";
      while (size > MIN && !fits()) box.style.fontSize = --size + "px";
      // When width (a long title) capped the size, spread the leftover
      // height into the row gap so the list fills the slide instead of
      // floating in the middle. The same gap in every column keeps rows
      // aligned across the split.
      const rows = Math.max(...[...cols.children].map((col) => col.children.length));
      const spare = Math.min(box.clientHeight, cols.scrollHeight * 1.5) - cols.scrollHeight;
      if (rows > 1 && spare > 0) {
        const extra = spare / (rows - 1);
        for (const col of cols.children) col.style.gap = `calc(0.42em + ${extra}px)`;
      }
      window.__layoutDone = true;
    })();
  </script>
</body>
</html>
