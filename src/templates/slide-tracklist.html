<!doctype html>
<html><head><meta charset="utf-8" />
<style>
html, body { margin: 0; width: 1080px; height: 1350px; background: #000; color: #fff; overflow: hidden; }
.badge { position: absolute; top: 28px; left: 36px; border: 3px solid #fff; padding: 4px 12px; font: 28px Impact, sans-serif; }
h1 { position: absolute; top: 90px; left: 36px; width: 1008px; margin: 0; font: 150px/0.85 Impact, sans-serif; text-transform: uppercase; }
.label { position: absolute; top: 280px; left: 36px; font: 52px Impact, sans-serif; letter-spacing: 2px; }
.rule { position: absolute; top: 345px; left: 36px; width: 344px; height: 6px; background: #E10600; }
ol { position: absolute; top: 370px; left: 36px; right: 36px; margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 24px; }
li { font: 36px Impact, sans-serif; margin: 0 0 10px; break-inside: avoid; }
.num { color: #E10600; margin-right: 16px; }
.feat { color: #E10600; font-size: 22px; }
.source { position: absolute; left: 36px; top: 1148px; color: #888; font: 18px Impact, sans-serif; }
.swipe { position: absolute; right: 36px; top: 1260px; font: 22px Impact, sans-serif; letter-spacing: 2px; }
</style></head>
<body>
  <div class="badge">NEWS</div>
  <h1>{{TITLE}}</h1>
  <div class="label">TRACKLIST</div>
  <div class="rule"></div>
  <ol>{{TRACKLIST}}</ol>
  <div class="source">{{SOURCE}}</div>
  <div class="swipe">SWIPE ▸▸</div>
</body></html>
