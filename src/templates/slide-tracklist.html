<!doctype html>
<!-- Slide 2 (album_drop): title + tracklist. Layout measured from
     STOKELY's Drive reference (808_Tracklist_Template.jpg). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Capture It";
    src: url("assets/Capture_it.ttf") format("truetype");
  }

  html, body {
    margin: 0;
    width: 1080px;
    height: 1350px;
    background: #000;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    color: #fff;
  }

  .badge {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 3px solid #fff;
    border-bottom: 3px solid #fff;
    border-left: 14px solid #fff;
    border-right: 14px solid #fff;
    box-sizing: border-box;
  }
  .badge span {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-style: italic;
    color: #fff;
  }
  .news-badge {
    left: 37.1%;
    width: 25.56%;
    top: 3.82%;
    height: 3.76%;
  }
  .news-badge span { font-size: 40px; }

  .glow {
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
  }

  .title {
    position: absolute;
    left: 3%;
    right: 3%;
    top: 10.5%;
    height: 15.5%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Capture It", Impact, sans-serif;
    text-transform: uppercase;
    font-size: 140px;
    line-height: 1;
  }
  .title .accent { color: #e01717; margin-left: 0.12em; }

  .subtitle {
    position: absolute;
    left: 0;
    right: 0;
    top: 25.8%;
    height: 5.3%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 46px;
  }

  .tracklist {
    position: absolute;
    left: 4%;
    right: 4%;
    top: 32%;
    bottom: 13.5%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 20px;
  }
  .track-row {
    display: flex;
    align-items: baseline;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: 46px;
    white-space: nowrap;
  }
  .track-row .num {
    width: 90px;
    flex-shrink: 0;
  }
  .track-row .feat {
    margin-left: 14px;
    font-size: 28px;
    font-weight: 700;
    color: #eee;
  }

  .rule {
    position: absolute;
    left: 14.12%;
    right: 0.51%;
    top: 92.9%;
    height: 3px;
    background: #fff;
  }

  .logo {
    position: absolute;
    left: 1.78%;
    top: 88.61%;
    width: 10.17%;
  }

  .swipe-badge {
    left: 35.52%;
    width: 29.04%;
    top: 94.18%;
    height: 4.78%;
  }
  .swipe-badge span { font-size: 44px; }

  .chevrons {
    position: absolute;
    left: 77.57%;
    width: 18.47%;
    top: 94.72%;
    height: 3.79%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chevron {
    width: 32px;
    height: 32px;
    border-top: 8px solid #fff;
    border-right: 8px solid #fff;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="badge news-badge glow"><span>NEWS</span></div>

    <div class="title">{{TITLE_HTML}}</div>
    <div class="subtitle">TRACKLIST</div>

    <div class="tracklist">
      {{TRACKLIST_ROWS_HTML}}
    </div>

    <div class="rule glow"></div>
    <img class="logo" src="assets/logo.png" />
    <div class="badge swipe-badge glow"><span>SWIPE</span></div>
    <div class="chevrons">
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
      <div class="chevron glow"></div>
    </div>
  </div>
</body>
</html>
