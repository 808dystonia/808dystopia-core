<!doctype html>
<!-- BoxArt pipeline: a PS1/PS2-style jewel-case front cover, artist photo
     swapped in where the reference template ("GLARE", SLUS-00888) had the
     game's own model shot. Single flat 1000x1400 image — real jewel case
     front-cover art is one printed insert, not a separately-rendered case +
     spine, so this is built the same way: one canvas, a vertical sidebar
     baked into the left edge of that same image. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap");

  html, body {
    margin: 0;
    width: 1000px;
    height: 1400px;
    background: #000;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1000px;
    height: 1400px;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* ---------- left spine strip ---------- */
  .spine {
    position: absolute;
    left: 0;
    top: 0;
    width: 130px;
    height: 100%;
    background: #050505;
    border-right: 2px solid #2a2a2a;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .spine-buttons {
    margin-top: 26px;
    display: flex;
    gap: 6px;
  }
  .spine-buttons svg { width: 15px; height: 15px; }
  .spine-word {
    margin-top: 18px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color: #fff;
    font-size: 34px;
    font-weight: 400;
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
    letter-spacing: 1px;
  }
  .spine-ntsc {
    margin-top: auto;
    margin-bottom: 190px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    border-top: 2px solid #fff;
    border-bottom: 2px solid #fff;
    padding: 8px 4px;
  }

  /* ---------- main cover area ---------- */
  .cover {
    position: absolute;
    left: 130px;
    top: 0;
    width: 870px;
    height: 100%;
  }

  .photo-wrap {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 1230px;
    overflow: hidden;
    background: #111;
  }
  .photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
  }
  /* the "glossy filter" -- a soft diagonal light streak + top sheen, like
     a photo behind curved glossy plastic/glass. */
  .gloss-sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg,
      rgba(255,255,255,0) 38%,
      rgba(255,255,255,0.16) 46%,
      rgba(255,255,255,0.38) 50%,
      rgba(255,255,255,0.10) 54%,
      rgba(255,255,255,0) 62%);
  }
  .gloss-top {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 22%);
  }
  .gloss-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.55);
  }
  .photo-gradient {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 46%;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 62%, #000 100%);
  }

  .top-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 22px;
    box-sizing: border-box;
    z-index: 2;
  }
  .ntsc-box {
    border: 2.5px solid #fff;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    background: rgba(0,0,0,0.35);
  }

  .title {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 148px;
    text-align: center;
    z-index: 2;
    padding: 0 24px;
    box-sizing: border-box;
  }
  .title span {
    font-family: "Orbitron", Impact, Arial, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: {{TITLE_FONT_SIZE}}px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #eaf6ff 0%, #8fd3ff 28%, #2f7fd6 52%, #dff3ff 70%, #1c4f8c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px #06111f;
    filter: drop-shadow(0 4px 0 #06111f) drop-shadow(0 0 26px rgba(90, 170, 255, 0.55));
  }

  .footer-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 170px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 26px;
    box-sizing: border-box;
  }

  .esrb {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }
  .esrb-t {
    border: 3px solid #fff;
    color: #fff;
    width: 68px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    font-weight: 800;
    font-family: Arial, sans-serif;
  }
  .esrb-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #fff;
  }
  .esrb-copy .rating {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .esrb-copy .caption {
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.5px;
    max-width: 150px;
    line-height: 1.2;
    margin-top: 4px;
  }

  .sony-mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sony-mark svg { width: 46px; height: 46px; }
  .sony-copy {
    color: #fff;
    line-height: 1.15;
  }
  .sony-copy .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
  .sony-copy .sub { font-size: 11px; color: #ccc; letter-spacing: 0.5px; }

  .slus {
    position: absolute;
    left: 14px;
    bottom: 14px;
    color: #888;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="spine">
      <div class="spine-buttons">
        <svg viewBox="0 0 24 24"><path d="M12 3 L20 19 L4 19 Z" fill="none" stroke="#3ddc84" stroke-width="2"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#ff5c7a" stroke-width="2"/></svg>
      </div>
      <div class="spine-buttons">
        <svg viewBox="0 0 24 24"><path d="M5 5 H19 V19 H5 Z" fill="none" stroke="#ff6fd8" stroke-width="2"/></svg>
        <svg viewBox="0 0 24 24"><path d="M5 12 L12 5 L19 12 L12 19 Z" fill="none" stroke="#4fa8ff" stroke-width="2"/></svg>
      </div>
      <div class="spine-word">PlayStation</div>
    </div>

    <div class="cover">
      <div class="photo-wrap">
        <img class="photo" src="{{PHOTO_URL}}" />
        <div class="gloss-sheen"></div>
        <div class="gloss-top"></div>
        <div class="gloss-vignette"></div>
        <div class="photo-gradient"></div>
        <div class="title"><span>{{ARTIST_NAME}}</span></div>
      </div>

      <div class="top-bar"><div class="ntsc-box">NTSC U/C</div></div>

      <div class="footer-bar">
        <div class="esrb">
          <div class="esrb-t">T</div>
          <div class="esrb-copy">
            <div class="rating">TEEN</div>
            <div class="caption">CONTENT RATED BY<br/>ESRB</div>
          </div>
        </div>
        <div class="sony-mark">
          <svg viewBox="0 0 100 100">
            <polygon points="50,4 96,50 50,96 4,50" fill="none" stroke="#ff8a1e" stroke-width="6"/>
          </svg>
          <div class="sony-copy">
            <div class="brand">SONY</div>
            <div class="sub">COMPUTER<br/>ENTERTAINMENT</div>
          </div>
        </div>
      </div>
    </div>

    <div class="slus">SLUS-{{CATALOG_NUMBER}}</div>
  </div>
</body>
</html>
