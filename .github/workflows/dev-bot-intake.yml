name: Dev Bot Task Intake

# Phase 0 of the 808 Dev Bot orchestrator: records an authorized,
# dev-bot:task-labeled GitHub issue as a tracked task in durable state
# (ops-state/dev-bot.json on the automation-state branch). Makes zero AI
# or third-party API calls and adds zero new recurring cost -- see
# docs/dev-bot.md for the full design and phase plan. Only Phase 0 is
# implemented: no agent execution, no Discord, no merge/deploy authority
# exists yet anywhere in this system.
on:
  issues:
    types: [labeled]

concurrency:
  group: 808-dev-bot-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write # durable dev-bot state lives on the automation-state branch
  issues: write # comment back on the issue with accept/reject

jobs:
  intake:
    # issues:labeled fires for every label on every issue; only react to
    # the one Dev Bot cares about. Keep this label name in sync with
    # TASK_LABEL in src/ops/dev-bot/task-intake.js.
    if: github.event.label.name == 'dev-bot:task'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/dev-bot-intake.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
