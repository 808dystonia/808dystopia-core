name: Daily Reel Post

# Genuinely free — same reasoning as daily-post.yml (GitHub Actions has
# no minutes cap on public repos; Render's cron jobs carry a $1/month
# minimum despite being labeled "free").
on:
  schedule:
    # Fires hourly (UTC). src/reel-cron.js gates the real run to the 7 PM
    # Chicago hour, year-round — DST-safe, same approach as daily-post.yml.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets a human trigger a run manually, e.g. for testing

permissions:
  contents: write # placeholder — only needed if step 4 ends up committing
                   # clip files the same way githubMedia.js hosts carousel
                   # slides; revisit once that step is actually built.

jobs:
  run:
    runs-on: ubuntu-latest
    # Video/audio download + local Whisper transcription + ffmpeg processing
    # needs real headroom, unlike the carousel's render-and-publish.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # yt-dlp downloads the candidate video's audio (step 3) — needs a real
      # account's cookies to get past YouTube's bot detection on datacenter
      # IPs (validated live: every cookie-less approach gets blocked). ffmpeg
      # itself ships preinstalled on ubuntu-latest runners.
      #
      # Cookies alone aren't enough, though — YouTube also throws a
      # JS-based "n challenge" at every request, which needs a JS runtime
      # yt-dlp can solve it with plus the actual solver script distribution
      # (yt-dlp-ejs). Validated live: Node was detected but reported
      # "unsupported" by yt-dlp's solver; deno (yt-dlp's own top-priority,
      # best-supported runtime) worked immediately once yt-dlp-ejs was
      # installed alongside it.
      - run: pip install --quiet yt-dlp yt-dlp-ejs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run reel
        env:
          TZ: America/Chicago
          REEL_PUBLISH: "1"
          DEEPSEEK_MODEL: deepseek-chat
          GOOGLE_SHEETS_REELS_TAB: Reels
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_REELS_CHANNEL_ID: ${{ secrets.DISCORD_REELS_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COMPOSIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.COMPOSIO_INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
