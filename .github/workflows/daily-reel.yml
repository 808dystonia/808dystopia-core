name: Daily Reel Post

# Hourly UTC trigger; the dependency-free gate uses America/Chicago.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: 808-reel
  cancel-in-progress: false
permissions:
  contents: write # media hosting and durable automation-state records
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_STATE_ENABLED: "1"
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Chicago posting window
        id: gate
        run: node scripts/schedule-gate.mjs reel
      - run: npm ci
        if: steps.gate.outputs.due == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: pip install --quiet yt-dlp yt-dlp-ejs curl_cffi
        if: steps.gate.outputs.due == 'true'
      - uses: denoland/setup-deno@v2
        if: steps.gate.outputs.due == 'true'
        with:
          deno-version: v2.x
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
        if: steps.gate.outputs.due == 'true'
      - name: Run reel
        if: steps.gate.outputs.due == 'true'
        run: npm run reel
        env:
          OPS_SLOT: ${{ steps.gate.outputs.slot }}
          TZ: America/Chicago
          REEL_PUBLISH: "1"
          REEL_FACEBOOK_CROSSPOST_PUBLISH: "1"
          DEEPSEEK_MODEL: deepseek-chat
          GOOGLE_SHEETS_REELS_TAB: Reels
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_REELS_CHANNEL_ID: ${{ secrets.DISCORD_REELS_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COMPOSIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.COMPOSIO_INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          COMPOSIO_FACEBOOK_ACCOUNT_ID: ${{ secrets.COMPOSIO_FACEBOOK_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.due == 'true'
        with:
          name: run-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
