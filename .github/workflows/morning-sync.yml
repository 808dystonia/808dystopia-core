name: Read-only Discord connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read source channels without publishing
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_HEAT_CHANNEL_ID: ${{ secrets.DISCORD_HEAT_CHANNEL_ID }}
          DISCORD_REELS_CHANNEL_ID: ${{ secrets.DISCORD_REELS_CHANNEL_ID }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.DISCORD_BOT_TOKEN) throw new Error('Bot token secret is missing');
          for (const [label, channel] of [['news', process.env.DISCORD_HEAT_CHANNEL_ID], ['reels', process.env.DISCORD_REELS_CHANNEL_ID]]) {
            if (!channel || !/^\d+$/.test(channel)) throw new Error(`${label}: channel secret missing or invalid`);
            let response;
            try {
              response = await fetch(`https://discord.com/api/v10/channels/${channel}/messages?limit=100`, {
                headers: { Authorization: `Bot ${process.env.DISCORD_BOT_TOKEN}` },
                signal: AbortSignal.timeout(30000),
              });
            } catch { throw new Error(`${label}: request failed`); }
            const data = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`${label}: Discord HTTP ${response.status}; code ${Number.isInteger(data?.code) ? data.code : 'unknown'}`);
            if (!Array.isArray(data)) throw new Error(`${label}: invalid message response`);
            const readable = data.filter(m => m.content?.trim() || m.embeds?.some(e => e.description?.trim()));
            const grok = data.filter(m => m.author?.id === '1545433897074950264');
            console.log(`${label}: HTTP ${response.status}; ${data.length} messages; ${readable.length} with readable text/embeds`);
            if (!readable.length) throw new Error(`${label}: no readable source content; check channel and Message Content Intent`);
            if (label === 'news') {
              const source = grok.find(m => m.embeds?.some(e => e.description?.trim()));
              if (!source) throw new Error('news: no readable Grok digest in last 100 messages');
              console.log(`news: latest readable Grok digest timestamp ${source.timestamp}`);
            }
          }
          console.log('PASS: both source channels readable. No writes or publishing performed.');
          JS
