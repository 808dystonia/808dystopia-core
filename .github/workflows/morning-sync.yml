name: Morning Site Sync

# Mirrors Grok's own morning #underground-news drop onto 808dystopia.win's
# Morning news box. Doesn't post anything to Discord -- Grok's own
# scheduled task already did that -- just reads it and writes it into the
# site's Netlify Blobs store.
on:
  schedule:
    # Fires hourly (UTC). src/morning-sync-cron.js gates the real run to
    # 10 AM Chicago time, year-round -- DST-safe, same approach as the
    # other pipelines.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets a human trigger a run manually, e.g. for testing

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run morning-sync
        env:
          TZ: America/Chicago
          SITE_SYNC_PUBLISH: "1"
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_HEAT_CHANNEL_ID: ${{ secrets.DISCORD_HEAT_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
