name: Dev Bot Status

# Phase 1 of the 808 Dev Bot orchestrator: once a day, posts a read-only
# summary of tracked task progress to #admin-general (same channel Phase
# 0/0.5 intake already posts to). Purely observational -- reads
# ops-state/dev-bot.json, writes nothing. Phase 2 adds a read-only PR/CI
# lookup for branch-ready/in-review tasks before the summary is built.
# Still no buttons, still no merge/deploy authority anywhere in the
# system. See docs/dev-bot.md.
on:
  schedule:
    - cron: "51 * * * *"
  workflow_dispatch: {}

concurrency:
  group: 808-dev-bot-status
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read # Phase 2: look up an open PR for a task's branch
  checks: read # Phase 2: read that PR's CI conclusion

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: gate
        name: Check daily Chicago window
        run: node scripts/schedule-gate.mjs dev-bot-status
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.due == 'true'
      - run: npm run dev-bot-status
        if: steps.gate.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Phase 2: PR/CI lookups
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
