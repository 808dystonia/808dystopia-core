name: Daily IG Carousel Post

# Hourly UTC trigger; the dependency-free gate uses America/Chicago.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Set to 'scheduler' by the Netlify hourly dispatcher; leave empty for a manual run"
        required: false
        default: ""
      story:
        description: "Optional: post this story now instead of the newest #underground-news story (one or two sentences, end with the source in parentheses)"
        required: false
        default: ""

# Runs dispatched by the Netlify scheduler (site/netlify/functions/
# dispatch-schedule.mjs) are treated exactly like GitHub's own scheduled
# runs: same Chicago window, slot and duplicate protection.
env:
  OPS_TRIGGER: ${{ inputs.trigger }}

concurrency:
  group: 808-carousel
  cancel-in-progress: false
permissions:
  contents: write # media hosting and durable automation-state records
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_STATE_ENABLED: "1"
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Chicago posting window
        id: gate
        run: node scripts/schedule-gate.mjs carousel
      - run: npm ci
        if: steps.gate.outputs.due == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
      # yt-dlp + ffmpeg for the video-drop clip slide (same setup as the Reel).
      - run: pip install --quiet yt-dlp yt-dlp-ejs curl_cffi
        if: steps.gate.outputs.due == 'true'
      - uses: denoland/setup-deno@v2
        if: steps.gate.outputs.due == 'true'
        with:
          deno-version: v2.x
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
        if: steps.gate.outputs.due == 'true'
      - name: Run carousel
        if: steps.gate.outputs.due == 'true'
        run: npm start
        env:
          OPS_SLOT: ${{ steps.gate.outputs.slot }}
          TZ: America/Chicago
          CAROUSEL_PUBLISH: "1"
          FACEBOOK_CROSSPOST_PUBLISH: "1"
          GOOGLE_SHEETS_TAB: News
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_HEAT_CHANNEL_ID: ${{ secrets.DISCORD_HEAT_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MANUAL_STORY: ${{ inputs.story }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          COMPOSIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.COMPOSIO_INSTAGRAM_ACCOUNT_ID }}
          COMPOSIO_PINTEREST_ACCOUNT_ID: ${{ secrets.COMPOSIO_PINTEREST_ACCOUNT_ID }}
          COMPOSIO_FACEBOOK_ACCOUNT_ID: ${{ secrets.COMPOSIO_FACEBOOK_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.due == 'true'
        with:
          name: run-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
