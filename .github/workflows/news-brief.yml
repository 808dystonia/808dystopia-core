name: News Brief

# Hourly UTC trigger; the dependency-free gate uses America/Chicago.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: 808-news-brief
  cancel-in-progress: false
permissions:
  contents: write # media hosting and durable automation-state records
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_STATE_ENABLED: "1"
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Chicago posting window
        id: gate
        run: node scripts/schedule-gate.mjs news-brief
      - run: npm ci
        if: steps.gate.outputs.due == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Run news-brief
        if: steps.gate.outputs.due == 'true'
        run: npm run news-brief
        env:
          OPS_SLOT: ${{ steps.gate.outputs.slot }}
          TZ: America/Chicago
          NEWS_BRIEF_PUBLISH: "1"
          SITE_SYNC_PUBLISH: "1"
          DEEPSEEK_MODEL: deepseek-chat
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_HEAT_CHANNEL_ID: ${{ secrets.DISCORD_HEAT_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.due == 'true'
        with:
          name: run-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
