name: BoxArt

# Genuinely free — same reasoning as the other workflows (GitHub Actions
# has no minutes cap on public repos).
on:
  schedule:
    # Fires hourly (UTC). src/boxart-cron.js gates the real run to
    # 9/10 AM, 1/2 PM & 5/6 PM Chicago hours, year-round — DST-safe, same
    # approach as the other pipelines. Matches the combined posting times
    # of the other two Pinterest boards (album-art at 9/1/5, RapToonz at
    # 10/2/6).
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets a human trigger a run manually, e.g. for testing

# Needed so the pipeline can commit each cover's rendered PNG to this repo
# (see src/clients/githubMedia.js) — same reasoning as the carousel/reel
# workflows: Pinterest needs a publicly-fetchable image_url.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # A Discord read, a photo download, one Puppeteer render, a repo
    # commit, one Pinterest pin, a Sheets read/append.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run boxart
        env:
          TZ: America/Chicago
          # Off until a real run is validated (real Discord read, cover
          # render, Pinterest pin) -- see the other pipelines' own history
          # of nothing posting live until tested.
          BOXART_PUBLISH: "0"
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_BOXART_CHANNEL_ID: ${{ secrets.DISCORD_BOXART_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          COMPOSIO_PINTEREST_ACCOUNT_ID: ${{ secrets.COMPOSIO_PINTEREST_ACCOUNT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
