name: Pin Post

# Genuinely free — same reasoning as the other workflows (GitHub Actions
# has no minutes cap on public repos). No new secrets needed at all --
# reuses the same Composio Discord/Pinterest/Sheets accounts and Spotify
# keys already configured for the other pipelines.
on:
  schedule:
    # Fires hourly (UTC). src/pin-cron.js gates the real run to the
    # 9 AM/1 PM/5 PM Chicago hours, year-round — DST-safe, same approach
    # as the other pipelines.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets a human trigger a run manually, e.g. for testing

jobs:
  run:
    runs-on: ubuntu-latest
    # Just a watchlist read, a couple Spotify calls, a Sheets read/append,
    # and one Pinterest pin.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run pin-post
        env:
          TZ: America/Chicago
          PIN_PUBLISH: "0" # flip to "1" once this pipeline is tested
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_REELS_CHANNEL_ID: ${{ secrets.DISCORD_REELS_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          COMPOSIO_PINTEREST_ACCOUNT_ID: ${{ secrets.COMPOSIO_PINTEREST_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
