name: Pin Post

# Hourly UTC trigger; the dependency-free gate uses America/Chicago.
on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch: {}

concurrency:
  group: 808-pin
  cancel-in-progress: false
permissions:
  contents: write # media hosting and durable automation-state records
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPS_STATE_ENABLED: "1"
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Chicago posting window
        id: gate
        run: node scripts/schedule-gate.mjs pin
      - run: npm ci
        if: steps.gate.outputs.due == 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Run pin
        if: steps.gate.outputs.due == 'true'
        run: npm run pin-post
        env:
          OPS_SLOT: ${{ steps.gate.outputs.slot }}
          TZ: America/Chicago
          PIN_PUBLISH: "1"
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_REELS_CHANNEL_ID: ${{ secrets.DISCORD_REELS_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          COMPOSIO_PINTEREST_ACCOUNT_ID: ${{ secrets.COMPOSIO_PINTEREST_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.due == 'true'
        with:
          name: run-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
