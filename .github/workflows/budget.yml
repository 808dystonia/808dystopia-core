name: Budget Check

# Genuinely free — same reasoning as the other workflows (GitHub Actions
# has no minutes cap on public repos).
on:
  schedule:
    # Fires hourly (UTC). src/budget-cron.js gates the real run to the
    # 8 PM Chicago hour, year-round — DST-safe, same approach as the
    # other pipelines.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets a human trigger a run manually, e.g. for testing

jobs:
  run:
    runs-on: ubuntu-latest
    # Two Sheets reads and, on a near/over day, one Discord post.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run budget
        env:
          TZ: America/Chicago
          # Keep at 0 until DISCORD_BUDGET_CHANNEL_ID is set and there's
          # real data in the Finances/Budget tabs to check against — same
          # "nothing posts until tested" posture as every other pipeline.
          BUDGET_PUBLISH: "0"
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          DISCORD_BUDGET_CHANNEL_ID: ${{ secrets.DISCORD_BUDGET_CHANNEL_ID }}
