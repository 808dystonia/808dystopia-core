name: RapToonz

# Genuinely free — same reasoning as the other workflows (GitHub Actions
# has no minutes cap on public repos). No paid API needed: Grok generates
# the images and posts them to #raptoonz; this pipeline just picks up the
# newest one and pins it.
on:
  schedule:
    # Fires hourly (UTC). src/raptoonz-cron.js gates the real run to the
    # 10 AM/2 PM/6 PM Chicago hours, year-round — DST-safe, same approach
    # as the other pipelines.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets a human trigger a run manually, e.g. for testing

jobs:
  run:
    runs-on: ubuntu-latest
    # Just a Discord read, a Sheets read/append, and one Pinterest pin.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run raptoonz
        env:
          TZ: America/Chicago
          RAPTOONZ_PUBLISH: "1"
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DISCORD_RAPTOONZ_CHANNEL_ID: ${{ secrets.DISCORD_RAPTOONZ_CHANNEL_ID }}
          COMPOSIO_DISCORD_ACCOUNT_ID: ${{ secrets.COMPOSIO_DISCORD_ACCOUNT_ID }}
          COMPOSIO_PINTEREST_ACCOUNT_ID: ${{ secrets.COMPOSIO_PINTEREST_ACCOUNT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          COMPOSIO_GOOGLESHEETS_ACCOUNT_ID: ${{ secrets.COMPOSIO_GOOGLESHEETS_ACCOUNT_ID }}
