services:
  - type: cron
    name: 808dystopia-core
    runtime: node
    plan: free
    region: oregon
    # Fires hourly on the hour (UTC) — cron itself has no timezone/DST
    # awareness, so instead of a fixed UTC time that would drift an hour
    # off target across the DST boundary, src/cron.js checks the current
    # America/Chicago hour on every firing and only runs the real pipeline
    # during the 9 AM Chicago hour, year-round.
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: America/Chicago
      # Everything below is a secret/credential — no value is committed.
      # Render will prompt for each on first deploy; fill them in from the
      # local .env (never itself committed — see .gitignore).
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        sync: false
      - key: DISCORD_HEAT_CHANNEL_ID
        sync: false
      - key: COMPOSIO_DISCORD_ACCOUNT_ID
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: COMPOSIO_INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: COMPOSIO_PINTEREST_ACCOUNT_ID
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GENIUS_ACCESS_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SHEETS_TAB
        value: Sheet1
      - key: COMPOSIO_GOOGLESHEETS_ACCOUNT_ID
        sync: false
      - key: CAROUSEL_PUBLISH
        value: "1"
